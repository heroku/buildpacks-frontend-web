[package]
name = "env_as_html_data_wasm"
description = "WebAssembly bindings for env-as-html-data"
repository = "https://github.com/heroku/buildpacks-frontend-web"
rust-version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lints]
workspace = true

[dependencies]
env_as_html_data = { path = "../env_as_html_data" }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.108"
